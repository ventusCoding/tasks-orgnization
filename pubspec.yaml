name: everslot_workspace
description: Everslot monorepo (pub workspace root).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/everslot_recurrence
  - packages/everslot_metrics

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    gen:
      description: Run code generation (Drift) in the app package.
      run: cd app && dart run build_runner build
    l10n:
      description: Merge per-feature ARB parts and generate localizations.
      run: dart run tool/merge_arb.dart && cd app && flutter gen-l10n
    analyze:
      description: Analyze every package.
      run: dart analyze --fatal-infos app packages/everslot_recurrence packages/everslot_metrics
    format:
      run: dart format app/lib app/test packages tool
    format:check:
      run: dart format --output=none --set-exit-if-changed app/lib app/test packages tool
    test:
      description: Run all tests.
      run: (cd packages/everslot_recurrence && dart test) && (cd packages/everslot_metrics && dart test) && (cd app && flutter test)
    test:coverage:
      description: Run all tests with coverage (lcov under each package's coverage/ folder).
      run: (cd packages/everslot_recurrence && dart test --coverage-path=coverage/lcov.info) && (cd packages/everslot_metrics && dart test --coverage-path=coverage/lcov.info) && (cd app && flutter test --coverage)
    gen:watch:
      description: Drift code generation in watch mode.
      run: cd app && dart run build_runner watch --delete-conflicting-outputs
    imports:
      description: Import-boundary and RTL checks over app/lib.
      run: dart run tool/check_imports.dart
    outdated:
      description: List outdated dependencies across the workspace.
      run: dart pub outdated
    clean:
      description: Remove build outputs and tool caches.
      run: (cd app && flutter clean) && rm -rf packages/*/coverage packages/*/.dart_tool

# SQLite build (T8.3.15): SQLite3MultipleCiphers — plain databases open as before; `PRAGMA key`
# enables the optional on-device encryption. See docs/architecture.md §3 / ADR-020.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
