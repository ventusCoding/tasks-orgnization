# Git hooks (T1.1.14): install with `brew install lefthook && lefthook install`.
pre-commit:
  parallel: true
  commands:
    dart-format:
      glob: "*.dart"
      exclude: "(\\.g\\.dart|l10n/generated/)"
      run: fvm dart format {staged_files} && git add {staged_files}
    deno-fmt:
      glob: "supabase/functions/**/*.ts"
      run: deno fmt {staged_files} && git add {staged_files}
commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits"; exit 1; }
