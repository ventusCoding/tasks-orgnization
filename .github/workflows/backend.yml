# Backend CI (T1.2.07, T1.2.09, T1.2.16): database migrations + pgTAP, Edge Functions fmt/lint/test, and
# the attachment pipeline against local Storage (T2.2.10).
# No secrets are needed: the local stack uses the CLI's built-in demo keys and every function degrades
# gracefully without FCM / cron secrets.
name: backend

on:
  pull_request:
    paths:
      - "supabase/**"
      - "fixtures/ids/**"
      - ".github/workflows/backend.yml"
      - "app/lib/features/attachments/**"
      - "app/test_storage/**"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "fixtures/ids/**"
      - ".github/workflows/backend.yml"
      - "app/lib/features/attachments/**"
      - "app/test_storage/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start the local stack (only the services the tests need)
        run: supabase start -x studio,logflare,vector,imgproxy,supavisor,edge-runtime,mailpit

      - name: Reset the database (all migrations + seed)
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      - name: Generated database types are up to date (T1.2.17)
        run: |
          supabase gen types typescript --local --schema app,private > /tmp/database.types.ts
          if ! diff -u supabase/functions/_shared/database.types.ts /tmp/database.types.ts; then
            echo "::error::supabase/functions/_shared/database.types.ts is stale. Regenerate it with:"
            echo "::error::supabase gen types typescript --local --schema app,private > supabase/functions/_shared/database.types.ts"
            exit 1
          fi

      - name: plpgsql lint (fails on errors)
        run: supabase db lint --local --schema app,private --level warning --fail-on error

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.x"

      - name: End-to-end push pipeline against the local stack (T7.4.15, FCM mocked)
        working-directory: supabase/functions
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|SECRET_KEY|DB_URL)=')"
          EVERSLOT_E2E=1 SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" SUPABASE_DB_URL="$DB_URL" \
            deno test -A push-dispatch/e2e_test.ts

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  storage:
    name: Attachments against local Storage (T2.2.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start the local stack (auth, REST, storage)
        run: supabase start -x studio,logflare,vector,imgproxy,supavisor,edge-runtime,mailpit,realtime

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: dart pub get

      - name: Storage suite (@Tags storage)
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          export API_URL PUBLISHABLE_KEY SECRET_KEY
          cd app && flutter test test_storage

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Functions (Deno 2.1, hosted-runtime compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.x"

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type-check entry points
        run: deno task check

      - name: Unit tests
        run: deno test -A

      - name: No lockfile committed
        run: test ! -e deno.lock
