name: release

# Tag vX.Y.Z to build signed store artifacts and deploy the backend (T9.2.04).
# Requires repository secrets — see docs/guide.md §"Release":
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD,
#   PLAY_SERVICE_ACCOUNT_JSON, APP_STORE_CONNECT_API_KEY_JSON, MATCH_PASSWORD, MATCH_GIT_URL,
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, ENV_PROD_JSON
on:
  push:
    tags: ['v*']

jobs:
  backend:
    name: Deploy backend (migrations + functions)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  android:
    name: Android release (Play internal track)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - id: fvm
        run: echo "version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ steps.fvm.outputs.version }}', channel: stable, cache: true }
      - name: Signing & env
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/app/upload-keystore.jks
          printf "storeFile=upload-keystore.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" "${{ secrets.ANDROID_STORE_PASSWORD }}" > app/android/key.properties
          mkdir -p app/env && echo '${{ secrets.ENV_PROD_JSON }}' > app/env/prod.json
      - run: dart pub get && dart run tool/merge_arb.dart && (cd app && flutter gen-l10n)
      - run: cd app && flutter build appbundle --release --flavor prod -t lib/main_prod.dart --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}
      - name: Upload to Play (fastlane)
        run: cd app/android && bundle exec fastlane beta
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  ios:
    name: iOS release (TestFlight)
    runs-on: macos-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ steps.fvm.outputs.version }}', channel: stable, cache: true }
      - run: mkdir -p app/env && echo '${{ secrets.ENV_PROD_JSON }}' > app/env/prod.json
      - run: dart pub get && dart run tool/merge_arb.dart && (cd app && flutter gen-l10n)
      - run: cd app && flutter build ipa --release -t lib/main_prod.dart --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }} --no-codesign
      - name: Sign & upload (fastlane)
        run: cd app/ios && bundle exec fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
