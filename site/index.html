<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everslot — English · Français · العربية</title>
  <meta name="description" content="Everslot: planner, nested checklists, habit and quit trackers, insights and reminders. Choose your language.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3b5bdb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1122" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="alternate" hreflang="en" href="https://YOUR_SITE_DOMAIN/en/index.html">
  <link rel="alternate" hreflang="fr" href="https://YOUR_SITE_DOMAIN/fr/index.html">
  <link rel="alternate" hreflang="ar" href="https://YOUR_SITE_DOMAIN/ar/index.html">
  <link rel="alternate" hreflang="x-default" href="https://YOUR_SITE_DOMAIN/">
  <script>
    // Sends visitors to their language (en, fr or ar; English otherwise). Without JavaScript the list below is used.
    (function () {
      var supported = ["en", "fr", "ar"];
      var prefs = navigator.languages || [navigator.language || ""];
      var target = "en";
      for (var i = 0; i < prefs.length; i++) {
        var code = String(prefs[i] || "").toLowerCase().split("-")[0];
        if (supported.indexOf(code) !== -1) {
          target = code;
          break;
        }
      }
      location.replace(target + "/");
    })();
  </script>
</head>
<body>
  <main class="picker">
    <img src="favicon.svg" alt="" width="72" height="72">
    <h1>Everslot</h1>
    <p>Choose your language · <span lang="fr">Choisissez votre langue</span> · <span lang="ar" dir="rtl">اختر لغتك</span></p>
    <ul>
      <li><a class="btn btn-primary" href="en/" hreflang="en">English</a></li>
      <li><a class="btn btn-primary" href="fr/" hreflang="fr" lang="fr">Français</a></li>
      <li><a class="btn btn-primary" href="ar/" hreflang="ar" lang="ar" dir="rtl">العربية</a></li>
    </ul>
  </main>
</body>
</html>
