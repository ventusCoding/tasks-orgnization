# App icons (T9.2.01). Regenerate with `tool/gen_branding.sh` — sources live in assets/branding/*.svg.
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 24
  image_path: "assets/branding/icon.png"
  image_path_android: "assets/branding/icon_legacy.png"
  adaptive_icon_background: "assets/branding/adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/branding/icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/branding/icon_tinted.png"
