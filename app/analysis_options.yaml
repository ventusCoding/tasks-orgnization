# App code uses the root strict set (very_good_analysis + strict casts/inference/raw types).
# The rules switched off below are style-only for app code; the pure packages keep them.
include: ../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "lib/l10n/**"
  errors:
    # Dart 3.13 `new(...)` constructor syntax: `dart fix` rewrites it incorrectly on this SDK.
    unnecessary_type_name_in_constructor: ignore
    # Widget/state fields read clearly without repeating the inferred type.
    specify_nonobvious_property_types: ignore
    # Pass-through `async` wrappers are intentional (uniform error zones).
    async_return_with_no_await: ignore
    # Hand-written models are immutable by convention (dev_patterns.md), not by annotation.
    avoid_equals_and_hash_code_on_mutable_classes: ignore
    # `unawaited(...)` is kept on purpose to mark fire-and-forget calls.
    unnecessary_unawaited: ignore
    cascade_invocations: ignore
    prefer_if_elements_to_conditional_expressions: ignore
    comment_references: ignore
    use_null_aware_elements: ignore
    prefer_constructors_over_static_methods: ignore
    avoid_positional_boolean_parameters: ignore
    always_put_required_named_parameters_first: ignore
    avoid_setters_without_getters: ignore
    avoid_bool_literals_in_conditional_expressions: ignore
    no_default_cases: ignore
    prefer_foreach: ignore
    # pubspec groups dependencies by purpose with comments.
    sort_pub_dependencies: ignore
    # Multi-line SQL and JSON literals split at parentheses/brackets on purpose.
    missing_whitespace_between_adjacent_strings: ignore
