name: everslot
description: "Everslot — own every slot of your day. Planner, nested checklists, habits & quit trackers, insights and reminders."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Workspace packages
  everslot_metrics:
    path: ../packages/everslot_metrics
  everslot_recurrence:
    path: ../packages/everslot_recurrence

  # Design libraries (built-in material is frozen since 3.44 — ADR-014)
  material_ui: ^1.4.0

  # State, routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Data
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # Backend & push (configured via env / placeholders — see docs/guide.md)
  supabase_flutter: ^2.17.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  tusc: ^4.0.0
  http: ^1.6.0

  # Notifications, time, background
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10

  # UI
  dynamic_color: ^2.1.0 # Android 12+ wallpaper colors (T1.3.08, optional)
  fl_chart: ^1.2.0
  two_dimensional_scrollables: ^0.5.4
  flutter_staggered_grid_view: ^0.7.0

  # Media & files
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  archive: ^4.3.0
  flutter_image_compress: ^2.5.1
  pdfrx: ^2.6.5
  share_plus: ^13.3.0
  mime: ^2.1.0
  crypto: ^3.0.7

  # Platform
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  home_widget: ^0.10.0
  quick_actions: ^1.1.1
  app_links: ^7.2.1
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  collection: ^1.19.1
  logging: ^1.3.0
  meta: ^1.16.0
  decimal: ^3.2.6
  video_player: ^2.14.0
  fc_native_video_thumbnail: ^3.0.1
  record: ^7.1.1
  cunning_document_scanner: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/fonts/inter/OFL.txt
    - assets/fonts/noto_sans_arabic/OFL.txt
  # Bundled fonts (T1.3.09, OFL 1.1): no runtime font downloads. Arabic falls back to Noto Sans Arabic.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_arabic/NotoSansArabic-Bold.ttf
          weight: 700
