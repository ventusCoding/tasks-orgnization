name: everslot
description: "Everslot — own every slot of your day. Planner, nested checklists, habits & quit trackers, insights and reminders."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Workspace packages
  everslot_metrics:
    path: ../packages/everslot_metrics
  everslot_recurrence:
    path: ../packages/everslot_recurrence

  # State, routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Data
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # Backend & push (configured via env / placeholders — see docs/guide.md)
  supabase_flutter: ^2.17.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_crashlytics: ^5.4.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  tusc: ^4.0.0
  http: ^1.6.0

  # Notifications, time, background
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  workmanager: ^0.10.10

  # UI
  fl_chart: ^1.2.0
  two_dimensional_scrollables: ^0.5.4
  flutter_staggered_grid_view: ^0.7.0

  # Media & files
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1
  pdfrx: ^2.6.5
  share_plus: ^13.3.0
  mime: ^2.1.0
  crypto: ^3.0.7

  # Platform
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  home_widget: ^0.10.0
  receive_sharing_intent: ^1.9.0
  quick_actions: ^1.1.1
  app_links: ^7.2.1
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  collection: ^1.19.1
  logging: ^1.3.0
  meta: ^1.16.0
  decimal: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
